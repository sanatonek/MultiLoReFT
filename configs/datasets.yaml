# Dataset configurations for evaluate_representations and baselines
# All paths are relative to project root

simulated:
  data_path: "./data/simplest_sim_nongaussian.npz"
  task_names:
    - shared
    - m1
    - m2
    - joint
  modality_names:
    - "I"
    - "II"
  input_dims: [10, 10]
  shared_rank: 10
  specific_rank: 10
  rank: 10
  pruning_threshold: 0.2
  batch_size: 256
  lr: 0.001
  prune: 0.1
  checkpoint_pattern: "{ckpts_dir}/{dataset}_multi_loreft_lr{lr:.4f}_bs{bs}_rank{rank}_prune{prune:.2f}_{seed}_no_stage.pth"

simulated_apollo:
  data_path: "./data/simulated_data_apollo.npz"
